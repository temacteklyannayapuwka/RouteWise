spring.application.name=routewise
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/routewise}
spring.datasource.username=${DB_USER:routewise}
spring.datasource.password=${DB_PASSWORD:routewise}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
